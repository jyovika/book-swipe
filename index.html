<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Swipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Book Swipe</h1>
    <p id="status">Loading books…</p>
    <article id="card" hidden>
      <img id="cover" alt="">
      <h2 id="title"></h2>
      <p id="author"></p>
      <p id="synopsis"></p>
    </article>
    <button id="next" hidden>Next book</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
