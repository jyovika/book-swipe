<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Swipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decoration only: layered paper-cut waves along the bottom of the screen. -->
  <svg class="waves" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path class="wave-1" d="M0,120 C60,90 110,140 170,115 C230,90 280,60 340,85 C370,98 390,90 400,85 L400,300 L0,300 Z"/>
    <path class="wave-2" d="M0,165 C50,140 100,175 160,160 C230,142 270,120 330,140 C360,150 385,140 400,135 L400,300 L0,300 Z"/>
    <path class="wave-3" d="M0,190 C70,165 120,205 190,185 C250,168 300,160 350,178 C375,187 390,180 400,176 L400,300 L0,300 Z"/>
    <path class="wave-4" d="M0,235 C60,215 120,245 190,230 C260,215 310,212 360,228 C380,234 392,230 400,228 L400,300 L0,300 Z"/>
  </svg>
  <main>
    <h1>Book Swipe</h1>
    <p id="status">Loading books…</p>
    <form id="join" hidden>
      <label>Your name <input id="name" maxlength="30" autocomplete="given-name" required></label>
      <button type="button" id="start">Start new session</button>
      <p class="or">or join your partner's session</p>
      <label>Session code <input id="code" maxlength="8" autocapitalize="characters" autocomplete="off"></label>
      <button type="button" id="join-btn">Join</button>
    </form>
    <article id="card" hidden>
      <img id="cover" alt="" draggable="false">
      <h2 id="title"></h2>
      <p id="author"></p>
      <p id="synopsis"></p>
    </article>
    <div id="choices" hidden>
      <button id="no" aria-label="Not interested">✕ Nope</button>
      <button id="yes" aria-label="Want to read">♥ Yes</button>
    </div>
    <ul id="matches" hidden></ul>
    <button id="round2" hidden>Start round 2</button>
    <section id="winner" hidden>
      <img id="winner-cover" alt="">
      <h2 id="winner-title"></h2>
      <p id="winner-author"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
